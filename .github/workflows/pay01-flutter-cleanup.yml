name: PAY-01 Flutter Cleanup (temporary)

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/pay01-flutter-cleanup.yml"
  push:
    branches:
      - work/PAY-01-server-authoritative-calculation
    paths:
      - ".github/workflows/pay01-flutter-cleanup.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out PAY-01 branch
        uses: actions/checkout@v5
        with:
          ref: work/PAY-01-server-authoritative-calculation

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.5"
          channel: stable
          cache: true

      - name: Remove exact dead helper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/mobile-flutter/lib/features/booking_flow/presentation/booking_flow_screen.dart")
          text = path.read_text()
          block = """  String _formatPrice(int price) {
    return price.toString().replaceAllMapped(
      RegExp(r'(\\d{1,3})(?=(\\d{3})+(?!\\d))'),
      (Match m) => '${m[1]},',
    );
  }

"""
          if text.count(block) != 1:
              raise SystemExit("Expected exactly one _formatPrice helper")
          path.write_text(text.replace(block, ""))
          PY

          dart format apps/mobile-flutter/lib/features/booking_flow/presentation/booking_flow_screen.dart
          git diff --check
          test "$(git diff --name-only)" = "apps/mobile-flutter/lib/features/booking_flow/presentation/booking_flow_screen.dart"

      - name: Resolve dependencies
        working-directory: apps/mobile-flutter
        run: flutter pub get

      - name: Verify strict analyzer
        working-directory: apps/mobile-flutter
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile-flutter/lib/features/booking_flow/presentation/booking_flow_screen.dart
          git commit -m "fix(flutter): remove dead booking price helper"
          git push origin HEAD:work/PAY-01-server-authoritative-calculation
