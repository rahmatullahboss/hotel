name: PAY-01 Source Snapshot (temporary)

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/pay01-source-snapshot.yml"
  push:
    branches:
      - work/PAY-01-server-authoritative-calculation
    paths:
      - ".github/workflows/pay01-source-snapshot.yml"

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out PAY-01 branch
        uses: actions/checkout@v5

      - name: Create tracked source archive
        shell: bash
        run: |
          git ls-files -z | tar --null -T - -czf pay01-source.tar.gz

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: pay01-source-${{ github.sha }}
          path: pay01-source.tar.gz
          if-no-files-found: error
          retention-days: 1
