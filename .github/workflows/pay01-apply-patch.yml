name: PAY-01 Apply Patch (temporary)

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/pay01-apply-patch.yml"
  push:
    branches:
      - work/PAY-01-server-authoritative-calculation
    paths:
      - ".github/workflows/pay01-apply-patch.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out PAY-01 branch
        uses: actions/checkout@v5
        with:
          ref: work/PAY-01-server-authoritative-calculation

      - name: Reconstruct and verify patch
        shell: bash
        run: |
          cat \
            .github/pay01-patch-aa.b64 \
            .github/pay01-patch-ab.b64 \
            .github/pay01-patch-ac.b64 \
            | base64 --decode > /tmp/pay01-patch.xz

          echo "ffc4dd03ce4c8d75a303bff37bcdf5c699a0f8ea0cb43256eab606407f56bb66  /tmp/pay01-patch.xz" \
            | sha256sum --check --strict
          xz --decompress --stdout /tmp/pay01-patch.xz > /tmp/pay01.patch
          git apply --check /tmp/pay01.patch

      - name: Apply exact PAY-01 checkpoint
        shell: bash
        run: |
          git apply /tmp/pay01.patch
          rm \
            .github/pay01-patch-aa.b64 \
            .github/pay01-patch-ab.b64 \
            .github/pay01-patch-ac.b64 \
            .github/workflows/pay01-apply-patch.yml

          cat > /tmp/expected-paths.txt <<'PATHS'
          .env.example
          .github/pay01-patch-aa.b64
          .github/pay01-patch-ab.b64
          .github/pay01-patch-ac.b64
          .github/workflows/booking-calculation.yml
          .github/workflows/pay01-apply-patch.yml
          apps/mobile-flutter/lib/features/booking_flow/presentation/booking_flow_screen.dart
          apps/mobile-flutter/lib/features/booking_flow/providers/stripe_payment_provider.dart
          apps/mobile-flutter/lib/features/bookings/presentation/booking_details_screen.dart
          apps/mobile-flutter/lib/features/bookings/providers/booking_provider.dart
          apps/web/app/actions/bookings.ts
          apps/web/app/api/bookings/route.ts
          apps/web/app/api/payment/callback/route.ts
          apps/web/app/api/payment/initiate/route.ts
          apps/web/app/api/payment/stripe/create-intent/route.ts
          apps/web/app/api/payment/stripe/verify/route.ts
          apps/web/app/booking/page.tsx
          apps/web/app/components/stripe-payment-form.tsx
          apps/web/lib/booking-calculation.ts
          apps/web/lib/booking-creation-service.ts
          apps/web/lib/booking-pricing-service.ts
          apps/web/messages/bn.json
          apps/web/messages/en.json
          docs/architecture/06-booking-calculation-authority.md
          packages/db/src/schema/business.ts
          tests/payments/booking-authority-contract.test.mjs
          tests/payments/booking-calculation.test.mjs
          tests/payments/booking-pricing-policy.test.mjs
          turbo.json
          PATHS

          git status --short
          {
            git diff --name-only
            git ls-files --others --exclude-standard
          } | sort -u > /tmp/actual-paths.txt
          sort -o /tmp/expected-paths.txt /tmp/expected-paths.txt
          diff -u /tmp/expected-paths.txt /tmp/actual-paths.txt

          test ! -e .github/workflows/pay01-source-snapshot.yml
          test ! -e .github/workflows/pay01-generate-migration.yml
          test ! -e .github/workflows/pay01-apply-patch.yml

      - name: Commit checkpoint
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "feat(payments): make booking calculation server authoritative"
          git push origin HEAD:work/PAY-01-server-authoritative-calculation
