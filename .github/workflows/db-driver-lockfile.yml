name: DB Driver Lockfile (temporary)

on:
  push:
    branches:
      - work/DB-01-migration-baseline
    paths:
      - ".github/workflows/db-driver-lockfile.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out workstream branch
        uses: actions/checkout@v5
        with:
          ref: work/DB-01-migration-baseline

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use declared npm version
        run: npm install --global npm@11.6.2

      - name: Add node-postgres migration tooling
        run: npm install --workspace @repo/db --save-dev pg @types/pg

      - name: Commit package metadata
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/db/package.json package-lock.json
          git commit -m "build(db): add node-postgres migration driver"
          git push origin HEAD:work/DB-01-migration-baseline
