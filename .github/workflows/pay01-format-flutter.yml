name: PAY-01 Format Flutter (temporary)

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/pay01-format-flutter.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out PAY-01 branch
        uses: actions/checkout@v5
        with:
          ref: work/PAY-01-server-authoritative-calculation

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.5"
          channel: stable
          cache: true

      - name: Format exact PAY-01 Flutter files
        shell: bash
        run: |
          dart format \
            apps/mobile-flutter/lib/features/booking_flow/presentation/booking_flow_screen.dart \
            apps/mobile-flutter/lib/features/bookings/providers/booking_provider.dart

          git diff --name-only | sort > /tmp/actual.txt
          cat > /tmp/expected.txt <<'PATHS'
          apps/mobile-flutter/lib/features/booking_flow/presentation/booking_flow_screen.dart
          apps/mobile-flutter/lib/features/bookings/providers/booking_provider.dart
          PATHS
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          git diff --check

      - name: Commit formatting
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/mobile-flutter/lib/features/booking_flow/presentation/booking_flow_screen.dart \
            apps/mobile-flutter/lib/features/bookings/providers/booking_provider.dart
          git commit -m "style(flutter): format PAY-01 booking changes"
          git push origin HEAD:work/PAY-01-server-authoritative-calculation
