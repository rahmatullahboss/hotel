name: Flutter Targeted Fix (temporary)

on:
  push:
    branches:
      - work/CI-02-strict-flutter-ci
    paths:
      - ".github/workflows/flutter-targeted-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
        with:
          ref: work/CI-02-strict-flutter-ci

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.5"
          channel: stable
          cache: true

      - name: Apply asserted analyzer fixes
        shell: python
        run: |
          from pathlib import Path

          room_path = Path("apps/mobile-flutter/lib/features/hotel/presentation/widgets/premium_room_card.dart")
          room = room_path.read_text()
          old_room = """                      Container(\n                        child: ElevatedButton(\n"""
          new_room = """                      ElevatedButton(\n"""
          if room.count(old_room) != 1:
              raise SystemExit(f"Expected exactly one redundant room-card Container, found {room.count(old_room)}")
          room = room.replace(old_room, new_room, 1)

          old_closing = """                        ),\n                      ),\n                    ],\n"""
          new_closing = """                      ),\n                    ],\n"""
          if room.count(old_closing) != 1:
              raise SystemExit(f"Expected exactly one matching room-card closing wrapper, found {room.count(old_closing)}")
          room_path.write_text(room.replace(old_closing, new_closing, 1))

          profile_path = Path("apps/mobile-flutter/lib/features/profile/presentation/profile_screen.dart")
          profile = profile_path.read_text()
          old_profile = "errorBuilder: (_, __, ___) => Icon("
          new_profile = "errorBuilder: (_, _, _) => Icon("
          if profile.count(old_profile) != 1:
              raise SystemExit(f"Expected exactly one profile errorBuilder pattern, found {profile.count(old_profile)}")
          profile_path.write_text(profile.replace(old_profile, new_profile, 1))

      - name: Format targeted files
        working-directory: apps/mobile-flutter
        run: dart format lib/features/hotel/presentation/widgets/premium_room_card.dart lib/features/profile/presentation/profile_screen.dart

      - name: Commit targeted fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile-flutter/lib/features/hotel/presentation/widgets/premium_room_card.dart apps/mobile-flutter/lib/features/profile/presentation/profile_screen.dart
          git commit -m "style(flutter): resolve remaining analyzer infos"
          git push origin HEAD:work/CI-02-strict-flutter-ci
