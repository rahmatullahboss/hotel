name: PAY-01 Lint Fix (temporary)

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/pay01-lint-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out PAY-01 branch
        uses: actions/checkout@v5
        with:
          ref: work/PAY-01-server-authoritative-calculation

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use declared npm version
        run: npm install --global npm@11.6.2

      - name: Apply exact lint cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, count: int) -> None:
              file = Path(path)
              text = file.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} occurrences, found {actual}: {old!r}")
              file.write_text(text.replace(old, new))

          replace_exact(
              "apps/web/app/actions/bookings.ts",
              "        const totalAmount = Number(booking.totalAmount) || 0;\n",
              "",
              2,
          )
          replace_exact(
              "apps/web/app/api/payment/callback/route.ts",
              "await db.transaction(async (tx: any) => {",
              "await db.transaction(async (tx: typeof db) => {",
              1,
          )
          replace_exact(
              "apps/web/app/booking/page.tsx",
              'import { useSearchParams, useRouter } from "next/navigation";',
              'import { useSearchParams } from "next/navigation";',
              1,
          )
          replace_exact(
              "apps/web/app/booking/page.tsx",
              'import { BottomNav, BookingQRCode } from "../components";',
              'import { BookingQRCode } from "../components";',
              1,
          )
          replace_exact(
              "apps/web/app/booking/page.tsx",
              "    const router = useRouter();\n",
              "",
              1,
          )
          replace_exact(
              "apps/web/app/booking/page.tsx",
              "} catch (err) {",
              "} catch {",
              2,
          )
          replace_exact(
              "apps/web/app/booking/page.tsx",
              "                            <img\n",
              "                            {/* eslint-disable-next-line @next/next/no-img-element -- provider room-photo URLs are dynamic */}\n                            <img\n",
              1,
          )
          PY

          git diff --check
          git diff --name-only | sort > /tmp/actual.txt
          cat > /tmp/expected.txt <<'PATHS'
          apps/web/app/actions/bookings.ts
          apps/web/app/api/payment/callback/route.ts
          apps/web/app/booking/page.tsx
          PATHS
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt

      - name: Install locked dependencies
        run: npm ci

      - name: Verify zero-warning lint
        working-directory: apps/web
        run: >-
          npx eslint --max-warnings 0
          lib/booking-calculation.ts
          lib/booking-pricing-service.ts
          lib/booking-creation-service.ts
          app/actions/bookings.ts
          app/api/bookings/route.ts
          app/api/payment/initiate/route.ts
          app/api/payment/stripe/create-intent/route.ts
          app/api/payment/stripe/verify/route.ts
          app/api/payment/callback/route.ts
          app/booking/page.tsx
          app/components/stripe-payment-form.tsx

      - name: Commit lint cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/app/actions/bookings.ts \
            apps/web/app/api/payment/callback/route.ts \
            apps/web/app/booking/page.tsx
          git commit -m "fix(payments): satisfy strict booking lint"
          git push origin HEAD:work/PAY-01-server-authoritative-calculation
