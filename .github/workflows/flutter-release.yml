name: Flutter CI/CD

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/mobile-flutter/**"
      - ".github/workflows/flutter-release.yml"
  push:
    branches:
      - main
      - develop
    tags:
      - "v*"
    paths:
      - "apps/mobile-flutter/**"
      - ".github/workflows/flutter-release.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Version (for example 1.0.0+1)"
        required: false
        default: ""
      build_type:
        description: "Signed release output"
        required: true
        default: both
        type: choice
        options:
          - apk
          - appbundle
          - both

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.38.5"
  JAVA_VERSION: "17"
  WORKING_DIR: apps/mobile-flutter

jobs:
  quality:
    name: Format, analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Show toolchain versions
        run: |
          flutter --version
          dart --version
          java -version

      - name: Resolve locked dependencies
        run: flutter pub get

      - name: Verify dependency lockfile is unchanged
        run: git diff --exit-code -- pubspec.lock

      - name: Verify tests exist
        shell: bash
        run: |
          if ! find test -type f -name '*_test.dart' -print -quit | grep -q .; then
            echo "::error::At least one committed *_test.dart file is required."
            exit 1
          fi

      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze Dart and Flutter code
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage-${{ github.run_id }}
          path: apps/mobile-flutter/coverage/lcov.info
          if-no-files-found: error
          retention-days: 14

  android-debug-build:
    name: Android debug build
    needs: quality
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve locked dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk-${{ github.run_id }}
          path: apps/mobile-flutter/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  signed-release-build:
    name: Signed Android release build
    needs: quality
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Verify signing configuration
        shell: bash
        run: |
          missing=0
          for variable in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::Required signing secret ${variable} is not configured."
              missing=1
            fi
          done
          exit "${missing}"

      - name: Resolve locked dependencies
        run: flutter pub get

      - name: Decode keystore
        shell: bash
        run: printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > android/app/upload-keystore.jks

      - name: Create key properties
        shell: bash
        run: |
          {
            printf 'storePassword=%s\n' "${KEYSTORE_PASSWORD}"
            printf 'keyPassword=%s\n' "${KEY_PASSWORD}"
            printf 'keyAlias=%s\n' "${KEY_ALIAS}"
            printf 'storeFile=upload-keystore.jks\n'
          } > android/key.properties

      - name: Resolve release version
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.version != ''
        shell: bash
        run: |
          version='${{ github.event.inputs.version }}'
          if [[ "${version}" == *+* ]]; then
            version_name="${version%%+*}"
            build_number="${version##*+}"
          else
            version_name="${version}"
            build_number="1"
          fi
          echo "VERSION_NAME=${version_name}" >> "${GITHUB_ENV}"
          echo "BUILD_NUMBER=${build_number}" >> "${GITHUB_ENV}"

      - name: Build signed release APK
        if: github.event.inputs.build_type != 'appbundle'
        shell: bash
        run: |
          arguments=(--release)
          if [[ -n "${VERSION_NAME:-}" ]]; then
            arguments+=(--build-name="${VERSION_NAME}" --build-number="${BUILD_NUMBER}")
          fi
          flutter build apk "${arguments[@]}"

      - name: Build signed release app bundle
        if: github.event.inputs.build_type != 'apk'
        shell: bash
        run: |
          arguments=(--release)
          if [[ -n "${VERSION_NAME:-}" ]]; then
            arguments+=(--build-name="${VERSION_NAME}" --build-number="${BUILD_NUMBER}")
          fi
          flutter build appbundle "${arguments[@]}"

      - name: Upload release APK
        if: github.event.inputs.build_type != 'appbundle'
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: apps/mobile-flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release app bundle
        if: github.event.inputs.build_type != 'apk'
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: apps/mobile-flutter/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f android/app/upload-keystore.jks android/key.properties

  release:
    name: Create GitHub release
    needs: signed-release-build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: artifacts/apk

      - name: Download release app bundle
        uses: actions/download-artifact@v4
        with:
          name: release-aab
          path: artifacts/aab

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Zinu Rooms ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            artifacts/apk/app-release.apk
            artifacts/aab/app-release.aab
