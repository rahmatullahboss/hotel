name: Flutter Autofix (temporary)

on:
  push:
    branches:
      - work/CI-02-strict-flutter-ci
    paths:
      - ".github/workflows/flutter-autofix.yml"

permissions:
  contents: write

concurrency:
  group: flutter-autofix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autofix:
    name: Apply Dart analyzer fixes
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out workstream branch
        uses: actions/checkout@v5
        with:
          ref: work/CI-02-strict-flutter-ci

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.5"
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: apps/mobile-flutter
        run: flutter pub get

      - name: Apply safe Dart fixes and formatting
        working-directory: apps/mobile-flutter
        run: |
          dart fix --apply
          dart format lib test

      - name: Commit generated fixes
        shell: bash
        run: |
          if git diff --quiet -- apps/mobile-flutter/lib apps/mobile-flutter/test; then
            echo "No autofix changes were required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile-flutter/lib apps/mobile-flutter/test
          git commit -m "style(flutter): apply Dart analyzer fixes"
          git push origin HEAD:work/CI-02-strict-flutter-ci
