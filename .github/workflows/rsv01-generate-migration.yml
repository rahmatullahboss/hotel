name: RSV-01 Generate Migration (temporary)

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/rsv01-generate-migration.yml"
  push:
    branches:
      - work/RSV-01-atomic-reservation-allocation
    paths:
      - ".github/workflows/rsv01-generate-migration.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_DIRECT_URL: postgresql://rsv01:rsv01@localhost:5432/rsv01

    steps:
      - name: Check out RSV-01 branch
        uses: actions/checkout@v5
        with:
          ref: work/RSV-01-atomic-reservation-allocation
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use declared npm version
        run: npm install --global npm@11.6.2

      - name: Install locked dependencies
        run: npm ci

      - name: Add booking stay check to Drizzle schema
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("packages/db/src/schema/business.ts")
          text = path.read_text()

          import_old = "    pgSequence,\n} from \"drizzle-orm/pg-core\";"
          import_new = "    pgSequence,\n    check,\n} from \"drizzle-orm/pg-core\";"
          if text.count(import_old) != 1:
              raise SystemExit("Unexpected pg-core import block")
          text = text.replace(import_old, import_new)

          start = text.index('export const bookings = pgTable("bookings", {')
          end = text.index("\n\nexport const bookingsRelations", start)
          block = text[start:end]
          if not block.endswith("});"):
              raise SystemExit("Unexpected bookings table ending")
          replacement = block[:-3] + "}, (table) => [\n    check(\"bookings_valid_stay\", sql`${table.checkIn} < ${table.checkOut}`),\n]);"
          text = text[:start] + replacement + text[end:]
          path.write_text(text)
          PY

          npx prettier --write packages/db/src/schema/business.ts
          git diff --check

      - name: Generate RSV-01 Drizzle migration
        run: >-
          npm --workspace @repo/db run db:generate --
          --name=atomic_reservation_allocation

      - name: Add PostgreSQL overlap invariant
        shell: bash
        run: |
          migration="packages/db/drizzle/0020_atomic_reservation_allocation.sql"
          test -f "${migration}"
          cat >> "${migration}" <<'SQL'
          --> statement-breakpoint
          CREATE EXTENSION IF NOT EXISTS "btree_gist";
          --> statement-breakpoint
          ALTER TABLE "bookings" ADD CONSTRAINT "bookings_room_stay_no_overlap" EXCLUDE USING gist (
            "roomId" WITH =,
            daterange("checkIn", "checkOut", '[)') WITH &&
          ) WHERE ("status" <> 'CANCELLED');
          SQL

          test -f packages/db/drizzle/meta/0020_snapshot.json
          last_tag="$(node -e "const j=require('./packages/db/drizzle/meta/_journal.json'); process.stdout.write(j.entries.at(-1)?.tag ?? '')")"
          test "${last_tag}" = "0020_atomic_reservation_allocation"
          grep -F 'CONSTRAINT "bookings_valid_stay" CHECK' "${migration}"
          grep -F 'CONSTRAINT "bookings_room_stay_no_overlap" EXCLUDE USING gist' "${migration}"
          grep -F 'daterange("checkIn", "checkOut", '\''[)'\'') WITH &&' "${migration}"
          git diff --check

      - name: Verify exact migration paths
        shell: bash
        run: |
          {
            git diff --name-only
            git ls-files --others --exclude-standard
          } | sort -u > /tmp/actual.txt
          cat > /tmp/expected.txt <<'PATHS'
          packages/db/drizzle/0020_atomic_reservation_allocation.sql
          packages/db/drizzle/meta/0020_snapshot.json
          packages/db/drizzle/meta/_journal.json
          packages/db/src/schema/business.ts
          PATHS
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt

      - name: Commit generated migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/db/src/schema/business.ts packages/db/drizzle
          git commit -m "db: enforce atomic physical-room reservations"
          git push origin HEAD:work/RSV-01-atomic-reservation-allocation
