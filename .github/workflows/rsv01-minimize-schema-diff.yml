name: RSV-01 Minimize Schema Diff (temporary)

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/rsv01-minimize-schema-diff.yml"
  push:
    branches:
      - work/RSV-01-atomic-reservation-allocation
    paths:
      - ".github/workflows/rsv01-minimize-schema-diff.yml"

permissions:
  contents: write

jobs:
  minimize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_DIRECT_URL: postgresql://rsv01:rsv01@localhost:5432/rsv01

    steps:
      - name: Check out RSV-01 branch
        uses: actions/checkout@v5
        with:
          ref: work/RSV-01-atomic-reservation-allocation
          fetch-depth: 0

      - name: Restore main formatting and apply exact schema change
        shell: bash
        run: |
          git show origin/main:packages/db/src/schema/business.ts > packages/db/src/schema/business.ts
          python - <<'PY'
          from pathlib import Path

          path = Path("packages/db/src/schema/business.ts")
          text = path.read_text()
          import_old = "    pgSequence,\n} from \"drizzle-orm/pg-core\";"
          import_new = "    pgSequence,\n    check,\n} from \"drizzle-orm/pg-core\";"
          if text.count(import_old) != 1:
              raise SystemExit("Unexpected pg-core import block")
          text = text.replace(import_old, import_new)

          start = text.index('export const bookings = pgTable("bookings", {')
          end = text.index("\n\nexport const bookingsRelations", start)
          block = text[start:end]
          if not block.endswith("});"):
              raise SystemExit("Unexpected bookings table ending")
          replacement = block[:-3] + "}, (table) => [\n    check(\"bookings_valid_stay\", sql`${table.checkIn} < ${table.checkOut}`),\n]);"
          updated = text[:start] + replacement + text[end:]
          path.write_text(updated.rstrip() + "\n")
          PY

          git diff --check
          test "$(git diff --name-only)" = "packages/db/src/schema/business.ts"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use declared npm version
        run: npm install --global npm@11.6.2

      - name: Install locked dependencies
        run: npm ci

      - name: Verify migration snapshots remain exact
        shell: bash
        run: |
          npm --workspace @repo/db run db:generate -- --name=rsv01_format_drift
          git diff --exit-code -- packages/db/drizzle
          test -z "$(git ls-files --others --exclude-standard packages/db/drizzle)"
          npm --workspace @repo/db run check-types

      - name: Commit minimal schema diff
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/db/src/schema/business.ts
          git commit -m "style(db): minimize reservation schema diff"
          git push origin HEAD:work/RSV-01-atomic-reservation-allocation
